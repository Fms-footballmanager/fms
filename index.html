<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Football Manager School</title>
<style>
  body { margin: 0; overflow: hidden; background:#0a2f22; }
  #hud {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Arial, sans-serif;
    font-size: 28px;
    color: white;
    text-shadow: 2px 2px 4px #000;
  }
</style>
</head>
<body>

<div id="hud"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
/* ================= VARIÁVEIS ================= */
let scene, camera, renderer;
let player, ball;
let keys = {};
let ballVelocity = new THREE.Vector3();
let goalRight, goalLeft;
let hud = document.getElementById("hud");

/* ================= INIT ================= */
init();
animate();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0, 90, 130);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  createLights();
  createCourt();
  createPlayer();
  createBall();
  createGoals();

  window.addEventListener("resize", onResize);
  window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
  window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
}

/* ================= LUZES ================= */
function createLights() {
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const light = new THREE.DirectionalLight(0xffffff, 0.9);
  light.position.set(50, 100, 30);
  scene.add(light);
}

/* ================= QUADRA ================= */
function createCourt() {
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(120, 80),
    new THREE.MeshStandardMaterial({ color:0x1e8c4a })
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  const line = new THREE.MeshStandardMaterial({ color:0xffffff });

  const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(120,0.3), line);
  centerLine.rotation.x = -Math.PI/2;
  scene.add(centerLine);
}

/* ================= JOGADOR ================= */
function createPlayer() {
  player = new THREE.Mesh(
    new THREE.CapsuleGeometry(2,6,4,8),
    new THREE.MeshStandardMaterial({ color:0x0055ff })
  );
  player.position.y = 4;
  scene.add(player);
}

/* ================= BOLA ================= */
function createBall() {
  ball = new THREE.Mesh(
    new THREE.SphereGeometry(1.5,32,32),
    new THREE.MeshStandardMaterial({ color:0xffffff })
  );
  ball.position.set(0,1.5,15);
  scene.add(ball);
}

/* ================= GOLS ================= */
function createGoals() {
  goalRight = createGoal(60);
  goalLeft  = createGoal(-60);
}

function createGoal(x) {
  const goal = new THREE.Group();

  const postMat = new THREE.MeshStandardMaterial({ color:0xffffff });

  const postL = new THREE.Mesh(new THREE.BoxGeometry(1,10,1), postMat);
  const postR = postL.clone();
  const bar   = new THREE.Mesh(new THREE.BoxGeometry(14,1,1), postMat);

  postL.position.set(x,5,-7);
  postR.position.set(x,5,7);
  bar.position.set(x,10,0);

  goal.add(postL, postR, bar);

  scene.add(goal);
  return goal;
}

/* ================= CONTROLES ================= */
function updateControls() {
  const speed = 1;
  if (keys["arrowup"]) player.position.z -= speed;
  if (keys["arrowdown"]) player.position.z += speed;
  if (keys["arrowleft"]) player.position.x -= speed;
  if (keys["arrowright"]) player.position.x += speed;

  if (keys[" "]) {
    shoot(keys["shift"]);
    keys[" "] = false;
  }
}

/* ================= CHUTE ================= */
function shoot(strong) {
  ballVelocity.z = strong ? -4 : -2.5;
}

/* ================= FÍSICA DA BOLA ================= */
function updateBall() {
  ball.position.add(ballVelocity);
  ballVelocity.multiplyScalar(0.97);

  if (Math.abs(ballVelocity.z) < 0.02) ballVelocity.set(0,0,0);

  checkGoal();
}

/* ================= COLISÃO DO GOL ================= */
function checkGoal() {
  if (Math.abs(ball.position.x) > 58 &&
      Math.abs(ball.position.z) < 6 &&
      ball.position.y < 6) {

    hud.innerText = "⚽ GOOOOOL!";
    ballVelocity.set(0,0,0);

    setTimeout(resetBall,1500);
  }
}

function resetBall() {
  hud.innerText = "";
  ball.position.set(0,1.5,15);
}

/* ================= LOOP ================= */
function animate() {
  requestAnimationFrame(animate);
  updateControls();
  updateBall();
  renderer.render(scene, camera);
}

/* ================= RESIZE ================= */
function onResize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
</script>

</body>
</html>
