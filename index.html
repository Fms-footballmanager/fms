<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Football Manager School</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #081f16;
}
#hud {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 32px;
  color: #fff;
  text-shadow: 3px 3px 6px #000;
  z-index: 10;
}
</style>
</head>
<body>

<div id="hud"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
/* ===================== VARIÁVEIS ===================== */
let scene, camera, renderer;
let player, ball;
let ballVelocity = new THREE.Vector3();
let keys = {};
let hud = document.getElementById("hud");

/* ===================== INIT ===================== */
init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x081f16, 150, 400);

  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 55, 90);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  createLights();
  createCourt();
  createStadium();
  createPlayer();
  createBall();
  createGoals();

  window.addEventListener("resize", onResize);
  window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
  window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
}

/* ===================== LUZES ===================== */
function createLights() {
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(100, 200, 100);
  light.castShadow = true;
  scene.add(light);
}

/* ===================== QUADRA ===================== */
function createCourt() {
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(220, 140),
    new THREE.MeshStandardMaterial({ color: 0x1f8f4e })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
}

/* ===================== ESTÁDIO / TORCIDA ===================== */
function createStadium() {
  const standMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

  for (let i = 0; i < 80; i++) {
    const fan = new THREE.Mesh(
      new THREE.BoxGeometry(2, 4, 2),
      new THREE.MeshStandardMaterial({
        color: Math.random() > 0.5 ? 0x0044ff : 0xff0000
      })
    );
    fan.position.set(
      (Math.random() - 0.5) * 200,
      4,
      Math.random() > 0.5 ? 80 : -80
    );
    scene.add(fan);
  }
}

/* ===================== JOGADOR ===================== */
function createPlayer() {
  player = new THREE.Mesh(
    new THREE.CapsuleGeometry(3, 10, 8, 16),
    new THREE.MeshStandardMaterial({ color: 0x0055ff })
  );
  player.position.y = 7;
  player.castShadow = true;
  scene.add(player);
}

/* ===================== BOLA ===================== */
function createBall() {
  ball = new THREE.Mesh(
    new THREE.SphereGeometry(2.3, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  ball.position.set(0, 2.3, 30);
  ball.castShadow = true;
  scene.add(ball);
}

/* ===================== GOLS ===================== */
function createGoals() {
  createGoal(105);
  createGoal(-105);
}

function createGoal(x) {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });

  const left = new THREE.Mesh(new THREE.BoxGeometry(1.5, 16, 1.5), mat);
  const right = left.clone();
  const bar = new THREE.Mesh(new THREE.BoxGeometry(24, 1.5, 1.5), mat);

  left.position.set(x, 8, -12);
  right.position.set(x, 8, 12);
  bar.position.set(x, 16, 0);

  scene.add(left, right, bar);
}

/* ===================== CONTROLES ===================== */
function updateControls() {
  const speed = 1.2;

  if (keys["arrowup"]) player.position.z -= speed;
  if (keys["arrowdown"]) player.position.z += speed;
  if (keys["arrowleft"]) player.position.x -= speed;
  if (keys["arrowright"]) player.position.x += speed;

  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 90;
  camera.lookAt(player.position);

  if (keys[" "]) {
    shoot(keys["shift"]);
    keys[" "] = false;
  }
}

/* ===================== CHUTE ===================== */
function shoot(strong) {
  ballVelocity.z = strong ? -5 : -3;
  ballVelocity.y = strong ? 0.3 : 0;
}

/* ===================== FÍSICA ===================== */
function updateBall() {
  ball.position.add(ballVelocity);
  ballVelocity.multiplyScalar(0.96);
  ballVelocity.y -= 0.01;

  if (ball.position.y < 2.3) {
    ball.position.y = 2.3;
    ballVelocity.y = 0;
  }

  checkGoal();
}

/* ===================== GOL ===================== */
function checkGoal() {
  if (Math.abs(ball.position.x) > 102 &&
      Math.abs(ball.position.z) < 12 &&
      ball.position.y < 12) {

    hud.innerText = "⚽ GOOOOOOL!";
    ballVelocity.set(0,0,0);

    setTimeout(() => {
      hud.innerText = "";
      ball.position.set(0,2.3,30);
    }, 2000);
  }
}

/* ===================== LOOP ===================== */
function animate() {
  requestAnimationFrame(animate);
  updateControls();
  updateBall();
  renderer.render(scene, camera);
}

/* ===================== RESIZE ===================== */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
</script>

</body>
</html>
